# Запуск всего проекта:  docker compose up --build
# Интерфейс: http://localhost:3000   API: http://localhost:8000
services:
  backend:
    build: .
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
